name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (不含 v)'
        required: true
        default: '1.2.3'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: npm run electron:build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run electron:build:win

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run electron:build:linux

      - name: List release files
        run: ls release/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: release/
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: List release files
        run: ls release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "## SubSilicon Editor v${VERSION}

          ### 下载

          | 平台 | 文件 |
          |------|------|
          | macOS (Apple Silicon) | SubSilicon Editor-${VERSION}-macos-arm64.dmg |
          | Windows | SubSilicon Editor-${VERSION}-windows-x64.exe |
          | Linux | SubSilicon Editor-${VERSION}-linux-x86_64.AppImage |
          " \
            release/*.dmg release/*.exe release/*.AppImage release/*.zip release/*.deb release/*.tar.gz release/*.blockmap

      - name: Sync release to Tencent Server (runner upload + scp)
        env:
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
          SERVER_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: '22022'
        run: |
          # runner 端 scp 上传 + 服务器端生成 yml（规避服务器→GitHub 网络差导致的同步超时）
          VERSION="${GITHUB_REF_NAME#v}"
          bash .github/scripts/sync-release-to-server.sh "$VERSION" release

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: '*'
          failOnError: false
