name: Sync Release to Tencent Server

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.18.2)'
        required: true
        default: 'v1.18.2'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ github.event.inputs.version }}
          mkdir -p /tmp/assets
          gh release download "$VERSION" -R junhan29/subsilicon-editor --dir /tmp/assets --pattern '*.*'
          # GitHub 资产文件名以点号分隔（SubSilicon.Editor-…），转成服务器空格格式（SubSilicon Editor-…）
          cd /tmp/assets
          for f in SubSilicon.Editor-*; do
            [ -f "$f" ] || continue
            mv "$f" "${f//.Editor-/ Editor-}"
            echo "renamed: $f -> ${f//.Editor-/ Editor-}"
          done
          ls -lh /tmp/assets

      - name: Sync to Tencent Server (runner upload + scp)
        env:
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
          SERVER_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: '22022'
        run: |
          VERSION=${{ github.event.inputs.version }}
          bash .github/scripts/sync-release-to-server.sh "${VERSION#v}" /tmp/assets
